name: Harga Emas

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harga-emas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil harga terbaru
        run: node scripts/harga-emas.mjs
      - name: Simpan bila berubah
        run: |
          if [ -z "$(git status --porcelain -- harga-emas.json)" ]; then echo "Tidak ada perubahan"; exit 0; fi
          git config user.name "harga-emas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harga-emas.json
          git commit -m "Harga emas $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          git pull --rebase --autostash
          git push
