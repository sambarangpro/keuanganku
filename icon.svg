<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Blue Gradient (Warna Aplikasi KeuanganKu) -->
    <linearGradient id="appLightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Top glass reflection -->
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="walletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369a1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background (Light Blue) -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#appLightBlueGrad)" />
  <rect x="12" y="12" width="488" height="240" rx="110" fill="url(#glassLight)" />

  <!-- Wallet Body (White) -->
  <g filter="url(#walletShadow)">
    <rect x="110" y="150" width="292" height="212" rx="36" fill="#ffffff" />
    <!-- Wallet Flap (Deeper Cyan #0284c7) -->
    <rect x="250" y="210" width="152" height="92" rx="22" fill="#0284c7" />
    <!-- Wallet Lock Coin (White Circle) -->
    <circle cx="352" cy="256" r="14" fill="#ffffff" />
  </g>
</svg>