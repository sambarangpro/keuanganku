<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Top-left subtle glow -->
    <radialGradient id="topGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Wallet drop shadow -->
    <filter id="walletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="110" fill="#020617" />

  <!-- Outer Gradient Border -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#frameGrad)" />

  <!-- Inner Dark Surface -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="#090d16" />

  <!-- Radial Glow -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="url(#topGlow)" />

  <!-- Center Wallet Icon (Scale 24x24 to 250x250) -->
  <g transform="translate(131, 131) scale(10.416)" filter="url(#walletShadow)">
    <path fill="#38bdf8" d="M21 7.28V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-2.28c.59-.35 1-.98 1-1.72V9c0-.74-.41-1.37-1-1.72zM20 9v6h-7V9h7zM5 19V5h14v2h-6c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h6v2H5z" />
    <circle cx="16" cy="12" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Golden PRO Badge -->
  <g transform="translate(325, 385)">
    <rect width="115" height="52" rx="14" fill="url(#badgeGrad)" />
    <text x="57" y="36" fill="#020617" font-size="28" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
