<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Preview Ikon Aplikasi</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
    .card-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 24px; text-align: center; width: 280px; }
    .icon-box { margin: 20px auto; width: 140px; height: 140px; border-radius: 30px; display: flex; align-items: center; justify-content: center; background: #020617; border: 1px solid #334155; }
    .icon-box img { width: 110px; height: 110px; border-radius: 22px; }
    h2 { font-size: 16px; margin: 0; color: #38bdf8; }
    p { font-size: 12px; color: #94a3b8; margin: 6px 0 0 0; }
  </style>
</head>
<body>
  <h1>Preview Ikon Aplikasi Saat Diinstal</h1>
  <div class="card-grid">
    <div class="card">
      <h2>1. Akun Pengguna (KeuanganKu PRO)</h2>
      <p>Warna Biru Muda (Warna Aplikasi)</p>
      <div class="icon-box">
        <img src="icon-512.png" alt="User App Icon">
      </div>
      <p style="color:#38bdf8; font-weight:bold;">Tampilan di Layar HP & Desktop</p>
    </div>
    <div class="card">
      <h2>2. Developer Portal</h2>
      <p>Ikon Terminal Header Dev Dashboard</p>
      <div class="icon-box">
        <img src="dev-icon-512.png" alt="Dev Icon">
      </div>
      <p style="color:#22d3ee; font-weight:bold;">Tampilan di Layar HP & Desktop</p>
    </div>
  </div>
</body>
</html>
