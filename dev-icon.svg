<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dev Header Gradient (Blue-600 via Indigo-600 to Cyan-400) -->
    <linearGradient id="devHeaderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <!-- Top glass reflection -->
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="terminalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background (Exact Dev Dashboard Header Color) -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#devHeaderGrad)" />
  <rect x="12" y="12" width="488" height="240" rx="110" fill="url(#glassLight)" />

  <!-- Terminal >_ Symbol in Crisp White -->
  <g filter="url(#terminalGlow)">
    <!-- Chevron > -->
    <path d="M 140 165 L 225 256 L 140 347" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Underscore Cursor _ -->
    <path d="M 268 347 L 372 347" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>